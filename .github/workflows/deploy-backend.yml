# DORMENTE ate a conta AWS ter o provider OIDC do GitHub.
#
# Criar esse provider exige a permissao iam:CreateOpenIDConnectProvider, que
# esta negada para o acesso atual. Enquanto isso, publique o backend com:
#
#   node scripts/deploy-lambda.mjs
#
# Quando o provider existir, crie a role de deploy (aws/deploy-trust-policy.json
# + aws/deploy-permission-policy.json), cadastre o ARN dela como o secret
# AWS_DEPLOY_ROLE_ARN e troque o "on:" abaixo de volta para push em main.

name: Deploy Backend to AWS Lambda

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Zip Lambda package
        run: |
          mkdir -p dist
          zip -r dist/function.zip lambda lib

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name koinops-backend \
            --zip-file fileb://dist/function.zip \
            --publish

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated --function-name koinops-backend
